<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖暖森林・國小五年級數學遊戲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;}
body{overflow:hidden;background:#FFE0B2;}
#bgCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
#ui>*{pointer-events:auto;margin:auto 0;}
.sound-toggle{position:fixed;top:14px;right:14px;z-index:3;border:none;border-radius:50%;width:40px;height:40px;font-size:1.15rem;background:rgba(255,255,255,.9);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2);transition:transform .15s;}
.sound-toggle:hover{transform:scale(1.1);}
.card{background:rgba(255,255,255,.95);border-radius:24px;padding:24px 28px;box-shadow:0 12px 40px rgba(230,126,34,.25);max-width:560px;width:100%;text-align:center;animation:cardIn .45s cubic-bezier(.34,1.56,.64,1);}
@keyframes cardIn{0%{opacity:0;transform:scale(.85) translateY(24px);}100%{opacity:1;transform:none;}}
h1{font-size:1.6rem;background:linear-gradient(135deg,#E65100,#F57C00);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2px;}
.sub{font-size:.82rem;color:#FFA726;margin-bottom:14px;font-weight:600;}
.big-emoji{font-size:2.6rem;margin-bottom:4px;animation:emojiBounce .7s cubic-bezier(.34,1.56,.64,1);}
@keyframes emojiBounce{0%{transform:scale(0) rotate(-15deg);}60%{transform:scale(1.2) rotate(6deg);}100%{transform:scale(1);}}
.small-note{font-size:.8rem;color:#8D6E63;line-height:1.8;margin-bottom:14px;}
.btn{border:none;border-radius:28px;padding:11px 30px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .15s;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.15);}
.btn:hover{transform:scale(1.06);}
.btn:active{transform:scale(.94);}
.btn:disabled{opacity:.4;cursor:default;transform:none;}
.btn.primary{background:linear-gradient(135deg,#FF9800,#E65100);}
.btn.green{background:linear-gradient(135deg,#66BB6A,#388E3C);}
.btn.blue{background:linear-gradient(135deg,#4FC3F7,#0288D1);}
.btn.purple{background:linear-gradient(135deg,#BA68C8,#8E24AA);}
.btn.gray{background:linear-gradient(135deg,#BDBDBD,#9E9E9E);padding:8px 20px;font-size:.85rem;border-radius:20px;}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
/* 對話框 */
.dialog{position:relative;background:#FFF9C4;border:3px solid #FFB74D;border-radius:18px;padding:14px 18px;margin-bottom:14px;text-align:left;animation:dialogIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes dialogIn{0%{opacity:0;transform:translateY(-20px) scale(.9);}100%{opacity:1;transform:none;}}
.dialog::before{content:"";position:absolute;top:-10px;left:30px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:12px solid #FFB74D;}
.dialog-text{font-size:1rem;color:#5D4037;line-height:1.6;}
.dialog-emoji{font-size:1.8rem;margin-right:6px;}
.q-text{font-size:1.7rem;font-weight:800;color:#E65100;margin-top:6px;}
/* 進度 */
.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;}
.prog-pill{background:#FFF3E0;border-radius:16px;padding:4px 16px;font-size:.78rem;font-weight:700;color:#E65100;border:2px solid #FFCC80;}
.prog-dots{display:flex;gap:5px;}
.prog-dot{width:12px;height:12px;border-radius:50%;background:#E0E0E0;border:2px solid #BDBDBD;transition:all .3s;}
.prog-dot.done{background:#FFD54F;border-color:#FFB74D;box-shadow:0 0 6px rgba(255,180,77,.6);animation:dotPop .4s;}
.prog-dot.cur{background:#66BB6A;border-color:#43A047;animation:dotPulse 1.2s infinite;}
@keyframes dotPop{50%{transform:scale(1.35);}}
@keyframes dotPulse{50%{transform:scale(1.25);}}
/* 站卡片 */
.station-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.station-card{border-radius:16px;padding:12px 10px;cursor:pointer;transition:all .2s;border:3px solid transparent;text-align:center;animation:cardIn .4s backwards;}
.station-card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.15);}
.station-card.locked{opacity:.5;cursor:default;background:#F5F5F5;}
.station-card.available{background:#FFF9C4;border-color:#FFCC80;}
.station-card.current{background:#E8F5E9;border-color:#66BB6A;box-shadow:0 0 14px rgba(102,187,106,.35);}
.station-card.done{background:#F3E5F5;border-color:#BA68C8;}
.station-emoji{font-size:1.9rem;}
.station-name{font-size:.88rem;font-weight:800;color:#5D4037;margin-top:2px;}
.station-topic{font-size:.68rem;color:#A1887F;margin-top:1px;}
.station-status{font-size:.66rem;font-weight:700;margin-top:3px;color:#8BC34A;}
.station-card.locked .station-status{color:#BDBDBD;}
/* 心情 */
.mood-row{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.mood-btn{border:2px solid #FFCC80;background:#FFF9C4;border-radius:16px;padding:8px 16px;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .15s;color:#8D6E63;}
.mood-btn:hover{transform:scale(1.06);}
.mood-btn.sel{background:#FF9800;color:#fff;border-color:#E65100;box-shadow:0 4px 12px rgba(230,81,0,.3);}
/* 難度 */
.diff-row{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.diff-btn{border:2px solid #BDBDBD;background:#FAFAFA;border-radius:18px;padding:7px 20px;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .15s;color:#757575;}
.diff-btn.sel{color:#fff;border-color:transparent;}
.diff-btn.sel[data-d="基礎"]{background:linear-gradient(135deg,#81C784,#388E3C);}
.diff-btn.sel[data-d="標準"]{background:linear-gradient(135deg,#FFB74D,#E65100);}
.diff-btn.sel[data-d="進階"]{background:linear-gradient(135deg,#BA68C8,#8E24AA);}
/* 輸入 */
.num-display{background:#FFF9C4;border:3px solid #FFB74D;border-radius:16px;padding:10px 20px;font-size:2rem;font-weight:800;color:#E65100;margin-bottom:10px;min-height:56px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.num-display.ok{background:#E8F5E9;border-color:#43A047;color:#2E7D32;animation:zoneFlash .5s;}
.num-display.no{background:#FFEBEE;border-color:#E53935;color:#C62828;animation:zoneShake .4s;}
@keyframes zoneFlash{50%{box-shadow:0 0 24px rgba(67,160,71,.5);}}
@keyframes zoneShake{20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto 10px;}
.key{border:none;border-radius:14px;padding:12px;font-size:1.2rem;font-weight:800;background:#FFF3E0;color:#E65100;cursor:pointer;transition:all .12s;box-shadow:0 3px 8px rgba(0,0,0,.12);}
.key:hover{background:#FFE0B2;transform:scale(1.08);}
.key:active{transform:scale(.92);}
.key.fn{background:#E8F5E9;color:#2E7D32;}
.frac-input{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;}
.frac-box{display:flex;flex-direction:column;align-items:center;}
.frac-input-field{width:64px;text-align:center;font-size:1.4rem;font-weight:800;border:3px solid #FFB74D;border-radius:12px;padding:6px;background:#FFF9C4;color:#E65100;}
.frac-bar{width:64px;height:4px;background:#E65100;border-radius:2px;margin:3px 0;}
.frac-x{font-size:1.4rem;font-weight:800;color:#8D6E63;}
/* 選項卡 */
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;}
.opt-btn{border:2.5px solid #FFCC80;background:#FFF9C4;border-radius:16px;padding:12px;font-size:1.15rem;font-weight:800;color:#5D4037;cursor:pointer;transition:all .15s;}
.opt-btn:hover{transform:scale(1.04);border-color:#FF9800;}
.opt-btn.sel{background:#FF9800;color:#fff;border-color:#E65100;}
/* 回饋 */
.feedback{margin-top:10px;padding:12px;border-radius:14px;font-size:.88rem;font-weight:600;line-height:1.7;animation:fbIn .35s cubic-bezier(.34,1.56,.64,1);text-align:left;}
@keyframes fbIn{0%{opacity:0;transform:scale(.7);}100%{opacity:1;transform:scale(1);}}
.feedback.ok{background:#E8F5E9;color:#2E7D32;border:2px solid #A5D6A7;}
.feedback.no{background:#FFF3E0;color:#E65100;border:2px solid #FFCC80;}
.verify-box{margin-top:8px;background:#FFF9C4;border-radius:10px;padding:8px 12px;font-size:.82rem;color:#8D6E63;font-weight:600;}
/* 紀念冊 */
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
.mem-card{border-radius:16px;padding:14px 8px;text-align:center;animation:cardIn .5s backwards;border:3px solid #FFB74D;background:linear-gradient(135deg,#FFF9C4,#FFF3E0);}
.mem-card.empty{background:#F5F5F5;border-color:#E0E0E0;opacity:.6;}
.mem-emoji{font-size:2.2rem;}
.mem-name{font-size:.8rem;font-weight:800;color:#5D4037;margin-top:2px;}
.mem-msg{font-size:.66rem;color:#A1887F;margin-top:2px;line-height:1.4;}
/* 通關 */
.ch-complete-emoji{font-size:3.2rem;animation:emojiBounce .8s;}
.ch-gift{font-size:1.1rem;font-weight:800;color:#8E24AA;margin:8px 0;animation:fadeIn .5s .3s both;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
/* 教具視覺 */
.manip{margin:8px auto 12px;max-width:340px;}
.frac-bar-viz{display:flex;height:28px;border-radius:8px;overflow:hidden;border:2px solid #E65100;background:#FFF3E0;}
.frac-bar-fill{background:linear-gradient(90deg,#FFB74D,#FF9800);transition:width .5s;}
.frac-bar-empty{background:#FFF3E0;}
.decimal-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:300px;margin:0 auto;}
.dec-cell{aspect-ratio:1;border-radius:4px;border:1.5px solid #FFB74D;}
.dec-cell.filled{background:linear-gradient(135deg,#FFB74D,#FF9800);}
.dec-cell.empty{background:#FFF9C4;}
.pct-bar{height:30px;border-radius:10px;border:2px solid #E65100;overflow:hidden;background:#FFF3E0;display:flex;}
.pct-fill{background:linear-gradient(90deg,#66BB6A,#43A047);transition:width .5s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:800;}
.shape-canvas{border:2px solid #FFB74D;border-radius:12px;background:#FFF9C4;max-width:320px;margin:0 auto;display:block;}
.hint-text{font-size:.75rem;color:#A1887F;margin-top:4px;}
@media(max-width:480px){
  .card{padding:16px 14px;border-radius:18px;}
  .q-text{font-size:1.35rem;}
  .station-grid{grid-template-columns:repeat(2,1fr);}
  .key{padding:10px;font-size:1rem;}
  .btn{padding:9px 22px;font-size:.9rem;}
  h1{font-size:1.3rem;}
}
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
/* ==================== 音效 ==================== */
let audioCtx=null,soundOn=true;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(f,d,t='sine',v=.12,delay=0){if(!soundOn)return;try{const c=getAudio(),T=c.currentTime+delay;const o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.setValueAtTime(f,T);g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(v,T+.02);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g).connect(c.destination);o.start(T);o.stop(T+d);}catch(e){}}
const SFX={
  click:()=>playTone(440,.07,'sine',.07),
  key:()=>playTone(550,.06,'triangle',.06),
  correct:()=>{playTone(523,.1);playTone(659,.1,'sine',.12,.07);playTone(784,.18,'sine',.13,.14);playTone(1047,.22,'sine',.1,.21);},
  wrong:()=>{playTone(280,.12,'sawtooth',.06);playTone(230,.15,'sawtooth',.05,.07);},
  chapter:()=>{[523,587,659,698,784,880,988,1047].forEach((f,i)=>playTone(f,.25,'triangle',.1,i*.07));},
  win:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>playTone(f,.3,'sine',.12,i*.09));},
};
document.getElementById("soundToggle").addEventListener("click",function(){soundOn=!soundOn;this.textContent=soundOn?"🔊":"🔇";if(soundOn)SFX.click();});
/* ==================== Three.js ==================== */
let scene,camera,renderer,controls,trees=[],sun,particles;
function initBG(){
  scene=new THREE.Scene();scene.fog=new THREE.Fog(0xFFE0B2,35,100);
  camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);camera.position.set(0,7,26);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById("bgCanvas"),antialias:true});
  renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
  controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.05;
  controls.maxPolarAngle=Math.PI*.48;controls.minDistance=14;controls.maxDistance=45;controls.autoRotate=true;controls.autoRotateSpeed=.35;
  scene.background=new THREE.Color(0xFFE0B2);
  scene.add(new THREE.HemisphereLight(0xFFF3E0,0xFFCC80,.8));
  sun=new THREE.DirectionalLight(0xFFFFFF,.9);sun.position.set(12,22,10);sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-40;sun.shadow.camera.right=40;sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;
  scene.add(sun);

  g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g);
  const tm=new THREE.MeshStandardMaterial({color:0x6D4C41,roughness:.9}),lm=new THREE.MeshStandardMaterial({color:0x558B2F,roughness:.7});
  for(let i=0;i<24;i++){const a=(i/24)*Math.PI*2,r=17+Math.random()*16,x=Math.cos(a)*r,z=Math.sin(a)*r,s=.8+Math.random()*.7;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.5*s,.7*s,4*s,8),tm);trunk.position.set(x,2*s,z);trunk.castShadow=true;
    const leaves=new THREE.Mesh(new THREE.ConeGeometry(2.4*s,5.5*s,8),lm);leaves.position.set(x,6.8*s,z);leaves.castShadow=true;
    const grp=new THREE.Group();grp.add(trunk);grp.add(leaves);grp.userData={phase:Math.random()*Math.PI*2};scene.add(grp);trees.push(grp);}
  const pg=new THREE.BufferGeometry(),n=140,pt=new Float32Array(n*3);
  for(let i=0;i<n;i++){pt[i*3]=(Math.random()-.5)*70;pt[i*3+1]=Math.random()*22+3;pt[i*3+2]=(Math.random()-.5)*70;}
  pg.setAttribute("position",new THREE.BufferAttribute(pt,3));
  particles=new THREE.Points(pg,new THREE.PointsMaterial({color:0xFFF176,size:.4,transparent:true,opacity:.85}));scene.add(particles);
  addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  animate(0);
}
function animate(t){requestAnimationFrame(animate);controls.update();
  trees.forEach(tr=>{tr.rotation.z=Math.sin(t*.001+tr.userData.phase)*.03;tr.children[1].position.y=6.8*tr.children[1].geometry.parameters.height/5.5+.15*Math.sin(t*.002+tr.userData.phase);});
  if(particles){const a=particles.geometry.attributes.position.array;for(let i=1;i<a.length;i+=3){a[i]+=Math.sin(t*.001+i)*.008;if(a[i]>25)a[i]=3;}particles.geometry.attributes.position.needsUpdate=true;}

function celebrate(){sun.intensity=1.5;setTimeout(()=>sun.intensity=.9,1500);trees.forEach(tr=>{let k=0;const iv=setInterval(()=>{tr.rotation.z=Math.sin(k*.4)*.18;k++;if(k>14){clearInterval(iv);tr.rotation.z=0;}},40);});}
function fireworks3D(){const cols=[0xFF6F00,0xFFD54F,0x66BB6A,0x42A5F5,0xBA68C8];for(let b=0;b<3;b++){setTimeout(()=>{const geo=new THREE.BufferGeometry(),n=180,pt=new Float32Array(n*3),vels=[];for(let i=0;i<n;i++){pt[i*3]=(Math.random()-.5)*8;pt[i*3+1]=2;pt[i*3+2]=(Math.random()-.5)*8;const a=Math.random()*Math.PI*2,e=Math.random()*Math.PI,sp=3+Math.random()*5;vels.push([Math.cos(a)*Math.sin(e)*sp,Math.cos(e)*sp+3,Math.sin(a)*Math.sin(e)*sp]);}geo.setAttribute("position",new THREE.BufferAttribute(pt,3));const mat=new THREE.PointsMaterial({color:cols[b%cols.length],size:.5,transparent:true,opacity:1});const fw=new THREE.Points(geo,mat);scene.add(fw);let life=0;const iv=setInterval(()=>{life+=16;const arr=geo.attributes.position.array;for(let i=0;i<n;i++){arr[i*3]+=vels[i][0]*.016;arr[i*3+1]+=vels[i][1]*.016;arr[i*3+2]+=vels[i][2]*.016;vels[i][1]-=9.8*.016;}mat.opacity=Math.max(0,1-life/2500);geo.attributes.position.needsUpdate=true;if(life>2600){clearInterval(iv);scene.remove(fw);geo.dispose();mat.dispose();}},16);},b*400);}}
/* ==================== 關卡資料 ==================== */
const STATIONS=[

];
const DIFFS=["基礎","標準","進階"];
const DIFF_MULT={"基礎":.6,"標準":1,"進階":1.5};
/* ==================== 出題引擎 ==================== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const gcd=(a,b)=>{while(b){[a,b]=[b,a%b];}return a;};

      return{type:"frac",question:`把 $\\frac{${num}}{${d}}$ 擴分，分母變成 ${nd}，分子是多少？`,qTex:`${num}/${d} = ?/${nd}`,ansNum:nn,ansDen:nd,verify:`${nn}/${nd} 約分：分子分母同除以 ${k}，回到 ${num}/${d} ✓`,hint:`擴分：分子分母同乘 ${k}`};
    } // 約分
    const g=gcd(nn,nd);
    return{type:"frac",question:`把 $\\frac{${nn}}{${nd}}$ 約分到最簡分數`,qTex:`${nn}/${nd} = ?/?`,ansNum:nn/g,ansDen:nd/g,verify:`${nn/g}/${nd/g} 擴分：同乘 ${g}，回到 ${nn}/${nd} ✓`,hint:`約分：分子分母同除以 ${g}`};

    const isAdd=Math.random()<.5;
    if(isAdd&&a+b<d)return{type:"frac",question:`$\\frac{${a}}{${d}} + \\frac{${b}}{${d}} = ?$`,qTex:`${a}/${d} + ${b}/${d} = ?/?`,ansNum:a+b,ansDen:d,verify:`驗算：${a+b}/${d} − ${a}/${d} = ${b}/${d} ✓`,hint:`同分母：分母不變，分子相加`};
    if(!isAdd&&a>b)return{type:"frac",question:`$\\frac{${a}}{${d}} − \\frac{${b}}{${d}} = ?$`,qTex:`${a}/${d} − ${b}/${d} = ?/?`,ansNum:a-b,ansDen:d,verify:`驗算：${a-b}/${d} + ${b}/${d} = ${a}/${d} ✓`,hint:`同分母：分母不變，分子相減`};
    return{type:"frac",question:`$\\frac{${a}}{${d}} + \\frac{${b}}{${d}} = ?$`,qTex:`${a}/${d} + ${b}/${d} = ?/?`,ansNum:a+b,ansDen:d,verify:`驗算：${a+b}/${d} − ${a}/${d} = ${b}/${d} ✓`,hint:`同分母：分母不變，分子相加`};
  }
  if(s===2){ // 小數
    const dec=diff==="基礎"?1:2;
    const f=Math.pow(10,dec);
    const a=R(10,99)/f,b=R(5,50)/f;
    const op=Math.random()<.6?"+":"×";
    if(op==="+"){const c=Math.round((a+b)*f)/f;return{type:"num",question:`${a} + ${b} = ?`,qTex:`${a} + ${b} = ?`,ans:c,verify:`驗算：${c} − ${a} = ${b} ✓`,hint:`小數點對齊，從右往左算`};}
    const m=R(2,9),c=Math.round(a*m*f)/f;
    return{type:"num",question:`${a} × ${m} = ?`,qTex:`${a} × ${m} = ?`,ans:c,verify:`驗算：${c} ÷ ${m} = ${a} ✓`,hint:`先當整數乘，再點小數點`};
  }
  if(s===3){ // 因數倍數
    const n=rnd(12);
    const divs=[];for(let i=1;i<=n;i++)if(n%i===0)divs.push(i);
    const k=R(2,5),mult=n*k;
    if(Math.random()<.5){
      return{type:"choice",question:`${n} 的因數有哪些？（選全部正確的）`,qTex:`${n} 的因數`,options:divs.slice(0,4).map(String),ans:divs.slice(0,4).map(String),multi:true,verify:`${n} = ${divs.slice(0,4).join("×")} ✓`,hint:`因數：能整除 ${n} 的數`};
    }
    return{type:"num",question:`${n} 的第 ${k} 倍數是多少？`,qTex:`${n} × ${k} = ?`,ans:mult,verify:`驗算：${mult} ÷ ${n} = ${k} ✓`,hint:`倍數：${n} × ${k}`};
  }
  if(s===4){ // 面積
    const shape=R(0,2);
    if(shape===0){const b2=rnd(8),h2=rnd(6);return{type:"num",question:`三角形：底 ${b2} 公分、高 ${h2} 公分，面積=？`,qTex:`底${b2} 高${h2} → 面積=?`,ans:b2*h2/2,verify:`驗算：${b2*h2/2} × 2 ÷ ${b2} = ${h2} ✓`,hint:`三角形面積 = 底 × 高 ÷ 2`};}
    if(shape===1){const b2=rnd(8),h2=rnd(6);return{type:"num",question:`平行四邊形：底 ${b2} 公分、高 ${h2} 公分，面積=？`,qTex:`底${b2} 高${h2} → 面積=?`,ans:b2*h2,verify:`驗算：${b2*h2} ÷ ${b2} = ${h2} ✓`,hint:`平行四邊形 = 底 × 高`};}
    const up=rnd(6),down=up+R(2,6),h2=rnd(5);
    return{type:"num",question:`梯形：上底 ${up}、下底 ${down}、高 ${h2} 公分，面積=？`,qTex:`上${up} 下${down} 高${h2} → ?`,ans:(up+down)*h2/2,verify:`驗算：(${up}+${down}) × ${h2} ÷ 2 = ${(up+down)*h2/2} ✓`,hint:`梯形 = (上底+下底) × 高 ÷ 2`};
  }
  if(s===5){ // 體積
    const isCube=Math.random()<.5;
    if(isCube){const e=rnd(6);return{type:"num",question:`正方體：邊長 ${e} 公分，體積=？`,qTex:`邊長${e} → 體積=?`,ans:e*e*e,verify:`驗算：${e*e*e} = ${e} × ${e} × ${e} ✓`,hint:`正方體 = 邊長 × 邊長 × 邊長`};}
    const l=rnd(8),w=rnd(6),h2=rnd(5);
    return{type:"num",question:`長方體：長 ${l}、寬 ${w}、高 ${h2} 公分，體積=？`,qTex:`長${l} 寬${w} 高${h2} → ?`,ans:l*w*h2,verify:`驗算：${l*w*h2} ÷ (${l}×${w}) = ${h2} ✓`,hint:`長方體 = 長 × 寬 × 高`};
  }
  // 百分率
  const price=Math.round(rnd(200)/50)*50;
  const pct=[10,20,25,30,40,50][R(0,5)];
  const isDiscount=Math.random()<.5;
  if(isDiscount){
    const off=price*pct/100,final=price-off;
    return{type:"num",question:`一件 ${price} 元的外套打 ${pct}% 折扣，便宜多少錢？`,qTex:`${price} 元打 ${pct}% 折 → 便宜?`,ans:off,verify:`驗算：${off} ÷ ${price} = ${pct}% ✓`,hint:`折扣金額 = 原價 × ${pct}%`};
  }
  const final=Math.round(price*(1-pct/100));
  return{type:"num",question:`${price} 元的商品打 ${pct}% 折後，售價多少？`,qTex:`${price} × (1−${pct}%) = ?`,ans:final,verify:`驗算：${final} ÷ ${price} = ${(100-pct)/100} ✓`,hint:`售價 = 原價 × (1 − ${pct}%)`};
}
/* ==================== React ==================== */
const {useState,useEffect,useCallback,useRef}=React;
const h=React.createElement;
/* ---- 音效開關组件 ---- ---- ---- ---- ---- ---- ---- ---- ---- */
/* ---- 首頁 ---- */

      "🦊 嗨，我是小狐狸暖暖！把好奇心帶上，我們一起發現數學的小秘密！"),

    h("div",{className:"mood-row"},
      ["好期待","想慢慢來","有點緊張"].map(m=>
        h("button",{key:m,className:"mood-btn"+(mood===m?" sel":""),onClick:()=>{SFX.click();setMood(m);}},m)

/* ---- 關卡地圖 ---- */

    h("div",{className:"big-emoji"},"🗺️"),

    h("div",{className:"diff-row"},
      DIFFS.map(d=>

        );

/* ---- 數字鍵盤 ---- */
function NumKeypad({value,onChange,onSubmit,disabled}){
  const press=(k)=>{
    if(disabled)return;
    SFX.key();
    if(k==="C")onChange("");
    else if(k==="⌫")onChange(String(value).slice(0,-1));
    else if(k==="."&&!String(value).includes("."))onChange(value+".");
    else if(k!=="."&&String(value).length<8)onChange(value+k);
  };
  const keys=["1","2","3","4","5","6","7","8","9",".","0","⌫"];
  return h("div",null,
    h("div",{className:"keypad"},
      keys.map(k=>h("button",{key:k,className:"key"+(k==="⌫"?" fn":""),onClick:()=>press(k),disabled},k)),
      h("button",{className:"key fn",style:{gridColumn:"span 3"},onClick:()=>{SFX.click();onSubmit();},disabled},"✅ 送出")
    )
  );
}
/* ---- 分數輸入 ---- */
function FracInput({num,setNum,den,setDen,onSubmit,disabled}){
  const press=(which,k)=>{
    if(disabled)return;
    SFX.key();
    const cur=which==="n"?num:den;
    if(k==="C"){which==="n"?setNum(""):setDen("");}
    else if(k==="⌫"){which==="n"?setNum(String(cur).slice(0,-1)):setDen(String(cur).slice(0,-1));}
    else if(String(cur).length<4){which==="n"?setNum(cur+k):setDen(cur+k);}
  };
  const keys=["1","2","3","4","5","6","7","8","9","0","⌫","C"];
  return h("div",null,
    h("div",{className:"frac-input"},
      h("div",{className:"frac-box"},
        h("input",{className:"frac-input-field",value:num,readOnly:true,placeholder:"分子"}),
        h("div",{className:"frac-bar"}),
        h("input",{className:"frac-input-field",value:den,readOnly:true,placeholder:"分母"})
      )
    ),
    h("div",{className:"small-note",style:{marginBottom:"6px"}},"分子鍵盤"),
    h("div",{className:"keypad"},keys.map(k=>h("button",{key:k,className:"key"+(k==="C"||k==="⌫"?" fn":""),onClick:()=>press("n",k),disabled},k))),
    h("div",{className:"small-note",style:{marginBottom:"6px",marginTop:"8px"}},"分母鍵盤"),
    h("div",{className:"keypad"},keys.map(k=>h("button",{key:k,className:"key"+(k==="C"||k==="⌫"?" fn":""),onClick:()=>press("d",k),disabled},k))),
    h("button",{className:"btn primary",style:{marginTop:"10px"},onClick:()=>{SFX.click();onSubmit();},disabled},"✅ 送出")
  );
}
/* ---- 選擇題 ---- */
function ChoiceInput({options,selected,setSelected,onSubmit,disabled,multi}){
  return h("div",null,
    h("div",{className:"opt-grid"},
      options.map((opt,i)=>
        h("button",{key:i,className:"opt-btn"+(selected.includes(opt)?" sel":""),onClick:()=>{
          if(disabled)return;
          SFX.click();
          if(multi){
            setSelected(selected.includes(opt)?selected.filter(x=>x!==opt):[...selected,opt]);
          }else{setSelected([opt]);}
        },disabled},opt)
      )
    ),
    h("button",{className:"btn primary",style:{marginTop:"6px"},onClick:()=>{SFX.click();onSubmit();},disabled:selected.length===0},"✅ 送出")
  );
}
/* ---- 教具視覺化 ---- */
function Manipulative({q}){
  if(!q)return null;
  if(q.type==="frac"){
    const num=parseInt(q.qTex.split("=")[0].split("/")[0])||1;
    const den=parseInt(q.qTex.split("=")[0].split("/")[1])||1;
    const pct=(num/den*100).toFixed(0);
    return h("div",{className:"manip"},
      h("div",{className:"frac-bar-viz"},
        h("div",{className:"frac-bar-fill",style:{width:pct+"%"}}),
        h("div",{className:"frac-bar-empty",style:{width:(100-pct)+"%"}})
      ),
      h("div",{className:"hint-text"},`${num}/${den} 的長條圖（${pct}%）`)
    );
  }
  if(q.type==="num"&&q.qTex.includes("×")&&!q.qTex.includes("÷")){
    return h("div",{className:"manip"},
      h("div",{className:"decimal-grid"},
        Array.from({length:30}).map((_,i)=>h("div",{key:i,className:"dec-cell "+(i<15?"filled":"empty")}))
      ),
      h("div",{className:"hint-text"},"小數方格：每格代表 0.1")
    );
  }
  if(q.qTex.includes("%")||q.question.includes("%")){
    return h("div",{className:"manip"},
      h("div",{className:"pct-bar"},h("div",{className:"pct-fill",style:{width:"70%"}},"70%")),
      h("div",{className:"hint-text"},"百分率長條：整條 = 100%")
    );
  }
  return null;
}
/* ---- 答題頁 ---- */
function QuizScreen({station,qi,q,diff,onAnswered,onNext,onBack,onDiffChange}){
  const [numInput,setNumInput]=useState("");
  const [fNum,setFNum]=useState("");const [fDen,setFDen]=useState("");
  const [selected,setSelected]=useState([]);
  const [fb,setFb]=useState(null);
  const [flash,setFlash]=useState("");
  const [showNext,setShowNext]=useState(false);
  useEffect(()=>{setNumInput("");setFNum("");setFDen("");setSelected([]);setFb(null);setShowNext(false);setFlash("");},[q]);
  const submit=()=>{
    let val,correct;
    if(q.type==="frac"){
      val=parseInt(fNum)/parseInt(fDen);
      correct=parseInt(fNum)===q.ansNum&&parseInt(fDen)===q.ansDen;
    }else if(q.type==="choice"){
      val=selected.join(",");
      correct=q.multi?selected.length===q.ans.length&&q.ans.every(a=>selected.includes(a)):selected[0]===String(q.ans);
    }else{
      val=parseFloat(numInput);
      correct=Math.abs(val-q.ans)<.001;
    }
    if(correct){
      SFX.correct();setFlash("ok");setShowNext(true);
      setFb({ok:true,msg:`答對了！☀️ ${q.verify}`});
      celebrate();onAnswered(true);
    }else{
      SFX.wrong();setFlash("no");
      setFb({ok:false,msg:"差一點點喔，再想想看！💡 "+(q.hint||"")});
      setTimeout(()=>setFlash(""),500);onAnswered(false);
    }
  };
  const st=STATIONS[station];
  return h("div",{className:"card"},
    h("div",{className:"top-bar"},
      h("button",{className:"btn gray",onClick:()=>{SFX.click();onBack();}},"🗺️ 地圖"),
      h("div",{className:"prog-pill"},`${st.name}・第 ${qi+1}/3 題`),
      h("div",{className:"prog-dots"},
        [0,1,2].map(i=>h("div",{key:i,className:"prog-dot"+(i<qi?" done":"")+(i===qi?" cur":"")}))
      ),
      h("button",{className:"btn gray",onClick:()=>{SFX.click();onDiffChange();}},diff==="基礎"?"🌱 基礎":(diff==="標準"?"🌿 標準":"🌻 進階"))
    ),
    h("div",{className:"dialog"},
      h("div",{className:"dialog-text"},
        h("span",{className:"dialog-emoji"},st.emoji),
        mood2greet(mood),
        h("div",{className:"q-text"},q.qTex)
      )
    ),
    h(Manipulative,{q}),
    q.type==="frac"
      ?h(FracInput,{num:fNum,setNum:setFNum,den:fDen,setDen:setFDen,onSubmit:submit,disabled:showNext})
      :q.type==="choice"
        ?h(ChoiceInput,{options:q.options,selected,setSelected,onSubmit:submit,disabled:showNext,multi:q.multi})
        :h("div",null,
            h("div",{className:"num-display "+flash},numInput||"?"),
            h(NumKeypad,{value:numInput,onChange:setNumInput,onSubmit:submit,disabled:showNext})
          ),
    fb&&h("div",{className:"feedback "+(fb.ok?"ok":"no")},fb.msg),
    showNext&&h("div",{style:{marginTop:"12px"}},
      h("button",{className:"btn green",onClick:()=>{SFX.click();onNext();}},qi<2?"下一題 →":"完成本站 🎉")
    )
  );
}
let mood="好期待";
function mood2greet(m){
  if(m==="好期待")return"嗨！幫我算算這一題吧！";
  if(m==="想慢慢來")return"不急喔，慢慢想，我陪你。";
  return"別緊張，錯了也沒關係，試試看！";
}
/* ---- 站完成 ---- */
function StationComplete({station,onContinue,onMem}){
  const st=STATIONS[station];
  useEffect(()=>{SFX.chapter();fireworks3D();},[]);
  return h("div",{className:"card"},
    h("div",{className:"ch-complete-emoji"},"🎉"),
    h("h1",null,`${st.name} 完成！`),
    h("div",{className:"ch-gift"},`${st.emoji} ${st.animal} 送你「${st.gift}」！`),
    h("div",{className:"small-note"},"已收進紀念冊，森林因你更溫暖了。"),
    h("div",{className:"btn-row"},
      h("button",{className:"btn purple",onClick:()=>{SFX.click();onMem();}},"📖 看紀念冊"),

    )

}
/* ---- 紀念冊 ---- */
function MemoryBook({mem,doneStations,onClose}){
  return h("div",{className:"card"},
    h("div",{className:"big-emoji"},"📖"),
    h("h1",null,"我的紀念冊"),
    h("div",{className:"sub"},`已收集 ${mem.length} / 7 份心意`),
    h("div",{className:"mem-grid"},
      STATIONS.map((st,i)=>{
        const has=mem.includes(i);
        return h("div",{key:i,className:"mem-card "+(has?"":"empty"),style:{animationDelay:(i*.08)+"s"}},
          h("div",{className:"mem-emoji"},has?st.emoji:"🔒"),
          h("div",{className:"mem-name"},st.animal),
          h("div",{className:"mem-msg"},has?st.gift:"完成站點後獲得")
        );
      })
    ),
    h("button",{className:"btn primary",onClick:()=>{SFX.click();onClose();}},"✅ 返回")
  );
}
/* ---- App ---- */
function App(){
  const [phase,setPhase]=useState("home");
  const [mood,setMood]=useState("好期待");
  const [diff,setDiff]=useState("標準");
  const [station,setStation]=useState(0);
  const [qi,setQi]=useState(0);
  const [q,setQ]=useState(null);
  const [progress,setProgress]=useState([0,0,0,0,0,0,0]);
  const [mem,setMem]=useState([]);
  const newQ=useCallback((st,df)=>genQ(st,df),[]);
  const startGame=useCallback(()=>{
    const first=progress.findIndex(p=>p<3);
    const st=first>=0?first:0;
    setStation(st);setQi(progress[st]||0);
    setQ(newQ(st,diff));setPhase("map");
  },[progress,diff,newQ]);
  const selectStation=useCallback((st)=>{
    setStation(st);setQi(0);setQ(newQ(st,diff));setPhase("play");
  },[diff,newQ]);
  const handleAnswered=useCallback((ok)=>{if(ok)setProgress(p=>{const n=[...p];n[station]=Math.max(n[station],qi+1);return n;});},[station,qi]);
  const nextQ=useCallback(()=>{
    if(qi<2){setQi(qi+1);setQ(newQ(station,diff));}
    else{setMem(m=>m.includes(station)?m:[...m,station]);setPhase("done");}
  },[qi,station,diff,newQ]);
  const cycleDiff=useCallback(()=>{
    const i=DIFFS.indexOf(diff);const nd=DIFFS[(i+1)%3];
    SFX.click();setDiff(nd);
    if(phase==="play"){setQ(newQ(station,nd));}
  },[diff,phase,station,newQ]);
  const memCount=mem.length;
  let screen;
  if(phase==="home")screen=h(HomeScreen,{mood,setMood,diff,setDiff,memCount,onStart:()=>setPhase("map"),onOpenMem:()=>setPhase("mem")});
  else if(phase==="map")screen=h(StationMap,{progress,diff,setDiff,onSelect:selectStation,onHome:()=>setPhase("home"),onOpenMem:()=>setPhase("mem"),memCount});
  else if(phase==="play")screen=h(QuizScreen,{station,qi,q,diff,onAnswered:handleAnswered,onNext:nextQ,onBack:()=>setPhase("map"),onDiffChange:cycleDiff});
  else if(phase==="done")screen=h(StationComplete,{station,onContinue:()=>{const next=progress.findIndex(p=>p<3);if(next>=0&&next!==station){/*stay on map*/}setPhase("map");},onMem:()=>setPhase("mem")});
  else if(phase==="mem")screen=h(MemoryBook,{mem,onClose:()=>setPhase("map")});
  return h("div",{key:phase+"-"+station+"-"+qi,style:{width:"100%",display:"flex",justifyContent:"center"}},screen);
}
initBG();
ReactDOM.createRoot(document.getElementById("ui")).render(h(App));
</script>
